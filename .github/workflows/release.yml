name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v0.14.2). Tag must exist.'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  # Nothing is published until this passes.
  #
  # This job exists because it did not. Release triggers on the tag and every
  # other job hung off `release`, so pushing a tag shipped to PyPI and OBS
  # while CI was still running; v1.0.0 went out with a failing test suite and
  # every OBS target then failed to build. A tag is a request to publish, not
  # evidence that publishing is safe.
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project
        run: pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest

      # A tag whose version does not match the files is a release nobody can
      # reproduce, and the distribution packages would carry the wrong number.
      - name: Check version consistency
        run: python scripts/release.py --check

      - name: Check the command surface
        run: python scripts/cli_parity.py

      - name: Check vendored assets
        run: python scripts/vendor_assets.py --check

      - name: Check the completion scripts are current
        run: python scripts/generate_completions.py --check

  quality:
    name: Lint and types before publishing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project and tools
        run: |
          pip install -e ".[all,dev]"
          pip install "ruff==0.14.4" "mypy==1.19.0"

      - name: Lint
        run: ruff check src/wasm tests scripts

      - name: Format
        run: ruff format --check src/wasm tests scripts

      - name: Types
        run: python scripts/typecheck.py

  # A clean machine, with only what the package declares. This is what an OBS
  # build environment looks like, and it is what catches an import of something
  # that is no longer a dependency: the developer's machine still has it
  # installed and says nothing.
  clean-install:
    name: Install as a user would
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build and install the wheel, nothing else
        run: |
          pip install build
          python -m build
          pip install "$(ls dist/*.whl)[all]"

      - name: Exercise it outside the source tree
        working-directory: /tmp
        run: |
          wasm --version
          wasm --help
          for group in backup cert db env monitor service setup site store web; do
            wasm "$group" --help > /dev/null
          done
          python - <<'PY'
          import importlib, pkgutil, sys
          import wasm

          failed = []
          for mod in pkgutil.walk_packages(wasm.__path__, "wasm."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {exc.__class__.__name__}: {exc}")
          if failed:
              print("Modules that fail to import from an installed package:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("Every module imports from the installed package")
          PY

  # Builds the .deb the way OBS does: in a container with only the declared
  # Build-Depends, and no network during the build.
  #
  # The GitHub runner has python3-yaml and half a dozen other things installed
  # already, so building there proves nothing about a build host. That is how
  # v1.0.0 shipped with incomplete Build-Depends and failed on every OBS
  # target, on every architecture, with ModuleNotFoundError.
  deb-in-a-clean-container:
    name: Build the .deb as OBS would
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        # The oldest and newest of each. Debian 12 and Ubuntu 22.04 are here
        # because they are the two releases without python3-questionary: the
        # package built there and apt then refused to install it, and nothing
        # in this workflow noticed because the job only listed the contents.
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "ubuntu:26.04"]
    steps:
      - name: Install only what a build host has
        run: |
          apt-get update
          apt-get install -y --no-install-recommends devscripts equivs git ca-certificates

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Lay out the debian directory
        run: |
          mkdir -p debian/source
          cp obs/debian.changelog debian/changelog
          cp obs/debian.control debian/control
          cp obs/debian.copyright debian/copyright
          cp obs/debian.rules debian/rules
          cp obs/debian.postinst debian/postinst
          cp obs/debian.postrm debian/postrm
          cp obs/wasm.default.yaml debian/wasm.default.yaml
          cp obs/wasm.dirs debian/dirs
          cp obs/wasm.manpages debian/manpages
          cp obs/wasm.1 debian/wasm.1
          cp obs/source/format debian/source/format
          cp obs/source/options debian/source/options
          chmod +x debian/rules

      # Installs exactly what debian/control declares, and nothing else. A
      # missing Build-Depends fails here rather than on somebody's server.
      - name: Install the declared build dependencies
        run: mk-build-deps --install --remove --tool "apt-get -y --no-install-recommends" debian/control

      - name: Build
        run: dpkg-buildpackage -us -uc -b

      - name: Check the package holds what it should
        run: |
          deb=$(ls ../wasm_*.deb)
          echo "Built $deb"
          dpkg-deb -c "$deb" > contents.txt
          for path in \
            usr/share/bash-completion/completions/wasm \
            usr/share/man/man1/wasm.1 \
            web/templates/base.html \
            web/static/app.css \
            web/static/vendor/htmx.min.js
          do
            grep -q "$path" contents.txt || { echo "MISSING from the package: $path"; exit 1; }
          done
          echo "Every expected file is in the package"

      # Building and installing are different claims. Debian 12 and Ubuntu
      # 22.04 built a package apt would not install, because it depended on
      # python3-questionary and those two releases do not have it. Listing the
      # contents said nothing about that.
      - name: Install it and run it
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y "$(ls ../wasm_*.deb)"
          wasm --version
          wasm --help > /dev/null
          wasm list --help > /dev/null
          echo "The package installs and the command runs"

      # The panel must import against the pydantic this distribution actually
      # packages, not the one pip installs. Ubuntu 24.04 ships pydantic 1.10
      # while pip, and therefore every other job in CI, runs pydantic 2:
      # v1.5.0 imported `field_validator`, a pydantic-2-only name, and
      # `wasm web start` died with ImportError on every Ubuntu 24.04 install
      # while the whole test suite stayed green. The web stack is a
      # Recommends, so this installs it exactly as `apt install wasm` would
      # and then imports the real web layer.
      - name: Import the panel with the distribution's own web stack
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y python3-fastapi python3-starlette python3-pydantic \
            python3-uvicorn python3-psutil || true
          if ! python3 -c "import fastapi" 2> /dev/null; then
            echo "This distribution does not package the web stack; the panel needs pip here. Skipping."
            exit 0
          fi
          # FastAPI grew pydantic 2 support (and the panel's minimum surface)
          # in 0.100. Debian 12 packages 0.92 and Ubuntu 22.04 something older
          # still, so on those the panel is pip-only and there is nothing to
          # check against the archive.
          if ! python3 -c "import fastapi, sys; sys.exit(0 if tuple(map(int, fastapi.__version__.split('.')[:2])) >= (0, 100) else 1)"; then
            echo "fastapi $(python3 -c 'import fastapi; print(fastapi.__version__)') predates 0.100; the panel needs pip here. Skipping."
            exit 0
          fi
          python3 -c "import fastapi, pydantic; print('fastapi', fastapi.__version__, '/ pydantic', pydantic.VERSION)"
          python3 -c "import wasm.web.api.router, wasm.web.server; print('The panel imports against the distribution web stack')"

  # The same thing for the RPM distributions, which are thirteen of the
  # twenty-two OBS targets and were the thirteen that failed.
  #
  # Two of the three defects it now catches were invisible on a developer
  # machine: a macro named inside a comment in %build is still expanded, and
  # the expansion is several lines, so the # comments out only the first one
  # and rpm runs the rest. That single comment failed every Fedora and
  # openSUSE target at once.
  rpm-in-a-clean-container:
    name: Build the RPM as OBS would
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # questionary reached Fedora in 42, so 41 is the one that proves the
          # requirement filter works.
          - image: "fedora:41"
            install: "dnf install -y rpm-build python3-devel python3-setuptools python3-pip python3-wheel git tar gzip"
          - image: "fedora:43"
            install: "dnf install -y rpm-build python3-devel python3-setuptools python3-pip python3-wheel git tar gzip"
          # zypper refresh exits 4 when any repository fails, including the
          # optional third-party ones an image ships with: openh264, backports
          # and update. A timed-out mirror at download.opensuse.org therefore
          # failed all three SUSE builds at once and, because publishing is
          # gated on them, refused to release a version whose packages were
          # fine. The refresh is best-effort now; the install that follows is
          # not, so a package that genuinely cannot be found still stops the
          # release.
          - image: "opensuse/tumbleweed"
            install: "zypper --non-interactive --gpg-auto-import-keys refresh || true; zypper --non-interactive install -y rpm-build python3-devel python3-setuptools python3-pip python3-wheel python-rpm-macros git tar gzip"
          # Leap 15.6's python3 is 3.6, which cannot parse this code. It builds
          # against the packaged 3.11 flavor instead, and this is what proves
          # the resulting package targets that interpreter.
          - image: "opensuse/leap:15.6"
            install: "zypper --non-interactive --gpg-auto-import-keys refresh || true; zypper --non-interactive install -y rpm-build python311-devel python311-setuptools python311-pip python311-wheel python-rpm-macros git tar gzip"
          - image: "opensuse/leap:16.0"
            install: "zypper --non-interactive --gpg-auto-import-keys refresh || true; zypper --non-interactive install -y rpm-build python3-devel python3-setuptools python3-pip python3-wheel python-rpm-macros git tar gzip"
    steps:
      - name: Install only what a build host has
        run: ${{ matrix.install }}

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # The same tarball the OBS job uploads: git archive of the tag, so only
      # committed files are in it and the build needs no network.
      - name: Lay out the rpmbuild tree
        run: |
          # actions/checkout falls back to downloading a tarball when the
          # container has no git, and then reports success. The result is a
          # working tree with no history, so the git archive below fails with
          # nothing to say about why. git is in the install line above; this
          # says so out loud if it ever stops being.
          if [ ! -d .git ]; then
            echo "No .git here: checkout fell back to a tarball because the"
            echo "container has no git, so the source tarball cannot be built"
            echo "from the commit. Add git to this image's install line."
            exit 1
          fi

          version=$(awk '/^Version:/ {print $2; exit}' rpm/wasm.spec)
          mkdir -p /rpmbuild/SOURCES /rpmbuild/SPECS
          git config --global --add safe.directory "$PWD"
          git archive --format=tar.gz --prefix="wasm-${version}/" HEAD ':!debian' \
            > "/rpmbuild/SOURCES/wasm-${version}.tar.gz"
          cp obs/wasm.default.yaml obs/wasm.1 /rpmbuild/SOURCES/
          cp rpm/wasm.spec /rpmbuild/SPECS/

      - name: Build
        run: rpmbuild --define "_topdir /rpmbuild" -ba /rpmbuild/SPECS/wasm.spec

      - name: Check the package holds what it should
        run: |
          rpm=$(find /rpmbuild/RPMS -name '*.rpm' | head -1)
          echo "Built $rpm"
          rpm -qlp "$rpm" > contents.txt
          for path in \
            share/bash-completion/completions/wasm \
            share/man/man1/wasm.1 \
            web/templates/base.html \
            web/static/app.css \
            web/static/vendor/htmx.min.js
          do
            grep -q "$path" contents.txt || { echo "MISSING from the package: $path"; exit 1; }
          done
          echo "Every expected file is in the package"

      - name: Install it and run it
        run: |
          rpm=$(find /rpmbuild/RPMS -name '*.rpm' | head -1)
          if command -v dnf > /dev/null; then
            dnf install -y --nogpgcheck "$rpm"
          else
            zypper --non-interactive install --allow-unsigned-rpm -y "$rpm"
          fi
          wasm --version
          wasm --help > /dev/null
          wasm list --help > /dev/null
          echo "The package installs and the command runs"

      # The same claim the deb job makes: the panel imports against the
      # pydantic this distribution packages, which on the RPM side is 2.x and
      # is the other half of the bridge in wasm.web.pydantic_compat. The web
      # stack is a Suggests in the spec, so it is installed here explicitly.
      - name: Import the panel with the distribution's own web stack
        run: |
          if command -v dnf > /dev/null; then
            dnf install -y python3-fastapi python3-starlette python3-pydantic \
              python3-uvicorn python3-psutil || true
          else
            zypper --non-interactive install -y python3-fastapi python3-starlette \
              python3-pydantic python3-uvicorn python3-psutil || true
          fi
          # Leap 15.6 builds the python 3.11 flavor while /usr/bin/python3 is
          # 3.6, so the default interpreter cannot import wasm at all there.
          if ! python3 -c "import wasm" 2> /dev/null; then
            echo "wasm is packaged for a non-default interpreter here. Skipping."
            exit 0
          fi
          if ! python3 -c "import fastapi" 2> /dev/null; then
            echo "This distribution does not package the web stack; the panel needs pip here. Skipping."
            exit 0
          fi
          if ! python3 -c "import fastapi, sys; sys.exit(0 if tuple(map(int, fastapi.__version__.split('.')[:2])) >= (0, 100) else 1)"; then
            echo "fastapi $(python3 -c 'import fastapi; print(fastapi.__version__)') predates 0.100; the panel needs pip here. Skipping."
            exit 0
          fi
          python3 -c "import fastapi, pydantic; print('fastapi', fastapi.__version__, '/ pydantic', pydantic.VERSION)"
          python3 -c "import wasm.web.api.router, wasm.web.server; print('The panel imports against the distribution web stack')"

  release:
    name: Create Release
    needs: [verify, quality, clean-install, deb-in-a-clean-container, rpm-in-a-clean-container]
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Extract changelog
        id: changelog
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          # Extract changelog for this version from obs/debian.changelog
          CHANGELOG=$(sed -n "/^wasm (${VERSION}/,/^wasm (/p" obs/debian.changelog | head -n -1 | tail -n +2 | sed 's/^  //')
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: WASM v${{ steps.get_version.outputs.version }}
          body: |
            ## Changes in v${{ steps.get_version.outputs.version }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ## Installation
            
            ### Ubuntu/Debian
            ```bash
            curl -fsSL https://download.opensuse.org/repositories/home:Perkybeet/xUbuntu_26.04/Release.key | sudo gpg --dearmor -o /usr/share/keyrings/wasm.gpg
            echo "deb [signed-by=/usr/share/keyrings/wasm.gpg] https://download.opensuse.org/repositories/home:Perkybeet/xUbuntu_26.04/ /" | sudo tee /etc/apt/sources.list.d/wasm.list
            sudo apt update && sudo apt install wasm
            ```
            
            ### Fedora
            ```bash
            sudo dnf config-manager addrepo --from-repofile=https://download.opensuse.org/repositories/home:Perkybeet/Fedora_42/home:Perkybeet.repo
            sudo dnf install wasm-cli
            ```
            
            ### From PyPI
            ```bash
            pip install wasm-cli
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-sdist:
    name: Build Source Distribution
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: |
            dist/*.tar.gz
            dist/*.whl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-deb:
    name: Build Debian Package
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-pip python3-wheel

      - name: Prepare Debian directory
        run: |
          mkdir -p debian
          cp obs/debian.changelog debian/changelog
          cp obs/debian.control debian/control
          cp obs/debian.copyright debian/copyright
          cp obs/debian.rules debian/rules
          cp obs/debian.postinst debian/postinst
          cp obs/debian.postrm debian/postrm
          cp obs/wasm.default.yaml debian/wasm.default.yaml
          cp obs/wasm.dirs debian/dirs
          cp obs/wasm.manpages debian/manpages
          cp obs/wasm.1 debian/wasm.1
          mkdir -p debian/source
          cp obs/source/format debian/source/format
          cp obs/source/options debian/source/options
          chmod +x debian/rules

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: ../wasm_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release, build-sdist]
    environment:
      name: pypi
      url: https://pypi.org/p/wasm-cli
    permissions:
      id-token: write  # Required for trusted publishing
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-obs:
    name: Publish to OBS
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag || github.ref }}
          fetch-depth: 0  # Full history for git archive

      - name: Install osc
        run: |
          sudo apt-get update
          sudo apt-get install -y osc

      - name: Configure osc
        env:
          OBS_USER: ${{ secrets.OBS_USER }}
          OBS_PASS: ${{ secrets.OBS_PASS }}
        run: |
          if [ -z "${OBS_USER}" ] || [ -z "${OBS_PASS}" ]; then
            echo "::error::OBS_USER or OBS_PASS secrets are not set. Update them in GitHub repository settings."
            exit 1
          fi

          # Create config in both locations for compatibility
          mkdir -p ~/.config/osc

          # Write config
          cat > ~/.oscrc << OSCEOF
          [general]
          apiurl = https://api.opensuse.org

          [https://api.opensuse.org]
          user = ${OBS_USER}
          pass = ${OBS_PASS}
          trusted_prj = openSUSE:Factory openSUSE:Tumbleweed
          OSCEOF

          # Remove leading spaces from heredoc
          sed -i 's/^          //' ~/.oscrc
          chmod 600 ~/.oscrc

          # Symlink to config dir
          ln -sf ~/.oscrc ~/.config/osc/oscrc

          # Verify credentials work before proceeding
          echo "=== Testing OBS connection ==="
          if ! osc api /about > /dev/null 2>&1; then
            echo "::error::OBS authentication failed (403 Forbidden). The OBS_PASS secret is likely expired. Update it at: https://github.com/Perkybeet/wasm/settings/secrets/actions"
            exit 1
          fi
          echo "OBS connection verified successfully."

      - name: Get version
        id: version
        run: |
          VERSION=$(head -n 1 obs/debian.changelog | grep -oP '\(\K[^)]+' | cut -d'~' -f1)
          VERSION_BASE=$(echo "${VERSION}" | cut -d'-' -f1)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_base=${VERSION_BASE}" >> $GITHUB_OUTPUT

      - name: Create source tarball
        run: |
          VERSION_BASE="${{ steps.version.outputs.version_base }}"
          git archive --format=tar.gz --prefix=wasm-${VERSION_BASE}/ HEAD ':!debian' > wasm-${VERSION_BASE}.tar.gz

      - name: Upload to OBS
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_BASE="${{ steps.version.outputs.version_base }}"
          TARBALL="wasm-${VERSION_BASE}.tar.gz"
          
          # Checkout OBS package
          osc checkout home:Perkybeet/wasm
          cd home:Perkybeet/wasm
          
          # Remove old tarballs
          for old in wasm-*.tar.gz; do
            [ -f "$old" ] && [ "$old" != "${TARBALL}" ] && osc rm "$old" 2>/dev/null || true
          done
          
          # Copy new files
          cp ../../${TARBALL} .
          cp ../../rpm/wasm.spec .
          cp ../../obs/wasm.dsc .
          cp ../../obs/debian.control .
          cp ../../obs/debian.rules .
          cp ../../obs/debian.changelog .
          cp ../../obs/debian.copyright .
          cp ../../obs/debian.postinst . 2>/dev/null || true
          cp ../../obs/debian.postrm . 2>/dev/null || true
          cp ../../obs/wasm.default.yaml . 2>/dev/null || true
          cp ../../obs/wasm.1 . 2>/dev/null || true
          cp ../../obs/wasm.dirs . 2>/dev/null || true
          cp ../../obs/wasm.manpages . 2>/dev/null || true
          
          # Add new files
          osc add ${TARBALL} 2>/dev/null || true
          osc add wasm.spec 2>/dev/null || true
          osc add wasm.dsc 2>/dev/null || true
          osc add debian.* 2>/dev/null || true
          osc add wasm.default.yaml 2>/dev/null || true
          osc add wasm.1 2>/dev/null || true
          
          # Show status and commit
          osc status
          osc commit -m "Release v${VERSION_BASE} from GitHub Actions"
          
          echo "✅ Package uploaded to OBS successfully!"
          echo "View at: https://build.opensuse.org/package/show/home:Perkybeet/wasm"
