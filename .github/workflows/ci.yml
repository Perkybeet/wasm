name: CI

on:
  push:
    branches: [main, "refactor/**", "dev/**"]
  pull_request:
    branches: [main]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeping the linter and type checker pinned means CI does not turn red
  # because a tool released a new rule overnight.
  RUFF_VERSION: "0.14.4"
  MYPY_VERSION: "1.19.0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check lint rules
        run: ruff check src/wasm tests scripts

      - name: Check formatting
        run: ruff format --check src/wasm tests scripts

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Type checking is the guard that matters most in this codebase: every
      # one of the calls to methods that did not exist, and which shipped for
      # entire releases because a blind except swallowed the AttributeError,
      # is caught here.
      - name: Install project and type checker
        run: |
          pip install -e ".[all,dev]"
          pip install "mypy==${MYPY_VERSION}"

      # Blocks against a committed baseline that can only shrink. Errors that
      # mean "this name does not exist" fail at zero regardless, because they
      # are the reason the gate exists.
      - name: Run mypy
        run: python scripts/typecheck.py

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Ubuntu 26.04 LTS ships, and it is where tarfile
        # tightened addfile(); testing it here is how that surfaced.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest --cov=wasm --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # Every other job installs pydantic 2 from pip, so none of them can see a
  # pydantic-1-only failure - and the .deb depends on the distribution
  # package, which on Ubuntu 24.04 and Debian 12 is pydantic 1.10. That is
  # how v1.5.0 imported `field_validator`, a pydantic-2-only name, and
  # `wasm web start` died with ImportError on every Ubuntu 24.04 install
  # while this whole workflow stayed green. This job pins pydantic to 1.10
  # and imports and tests the real web layer against it, exercising the
  # bridge in wasm.web.pydantic_compat from its v1 side.
  #
  # fastapi is pinned to 0.115, the last line that supports pydantic 1: noble
  # itself ships 0.101, but the test fixtures need starlette's newer
  # TestClient, and the release workflow's container jobs already import the
  # panel against noble's exact versions. What this job guards is the
  # pydantic major, which is where the names differ.
  pydantic-v1:
    name: Panel on pydantic 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the panel with pydantic 1.10
        run: |
          pip install --no-deps -e .
          pip install "pydantic==1.10.*" "fastapi>=0.115,<0.116" "httpx<0.28" \
            jinja2 psutil pyyaml click rich pytest pytest-mock

      - name: Import the real web layer
        run: |
          python - <<'PY'
          import pydantic
          assert pydantic.VERSION.startswith("1."), pydantic.VERSION
          import wasm.web.api.router, wasm.web.server
          print(f"The web layer imports under pydantic {pydantic.VERSION}")
          PY

      # Endpoints whose models and validators go through the bridge, the
      # error contract every router answers in, sudo mode, the job and app
      # events the console caches as API responses, and the console itself
      # being served on the stack Ubuntu 24.04 actually installs.
      - name: Run the bridged endpoints' tests
        run: |
          pytest -q \
            tests/test_web_backup_schedules.py \
            tests/test_web_cron_api.py \
            tests/test_web_errors.py \
            tests/test_web_sudo.py \
            tests/test_web_events.py \
            tests/test_spa_serving.py

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[all]"

      # Importing every module catches syntax errors, circular imports and
      # missing dependencies in code paths no test happens to reach.
      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import wasm

          failed = []
          for mod in pkgutil.walk_packages(wasm.__path__, "wasm."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {exc.__class__.__name__}: {exc}")
          if failed:
              print("Modules that failed to import:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("All modules import cleanly")
          PY

      - name: Run the CLI
        run: |
          wasm --version
          wasm --help

  # The console is built by Node but shipped by Python: src/wasm/web/static
  # is the committed output of panel/, because OBS packages `git archive
  # HEAD` with no network and never runs Node. This job is the proof that
  # what is committed is what the source produces - the same pattern as the
  # man page and the completions - plus the frontend's own gates: the typed
  # API contract is current, lint, types and unit tests.
  panel:
    name: Console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: panel
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: panel/.nvmrc
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install exactly the locked dependencies
        run: npm ci

      - name: Check the API types match the exported OpenAPI schema
        run: npm run check:api

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      # `git diff` alone misses a chunk the build created and nobody
      # committed; `git status` sees both that and a deleted one.
      - name: Check the committed build matches the source
        working-directory: .
        run: |
          git diff --exit-code --stat -- src/wasm/web/static
          untracked=$(git status --porcelain -- src/wasm/web/static)
          if [ -n "$untracked" ]; then
            echo "The committed console build differs from what panel/ produces:"
            echo "$untracked"
            echo "Run 'cd panel && npm run build' and commit src/wasm/web/static."
            exit 1
          fi

  # The console against the real backend in a real browser: every page in
  # both themes with axe reporting zero WCAG 2.2 AA violations and zero
  # Content Security Policy violations. A policy is only enforced in a
  # browser, which is how the strict one once shipped and silently switched
  # features off; this job is what makes that impossible now.
  e2e:
    name: Console end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v7
        with:
          node-version-file: panel/.nvmrc
          cache: npm
          cache-dependency-path: panel/package-lock.json

      # scripts/console_server.py runs the real FastAPI app on a sandboxed,
      # seeded store with a fake command runner, so nothing here needs root
      # or touches the runner's own systemd.
      - name: Install the project
        run: pip install -e ".[web]"

      - name: Install the console's dependencies
        working-directory: panel
        run: npm ci

      - name: Install the browser
        working-directory: panel
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: panel
        env:
          WASM_PYTHON: python
        run: npm run e2e

      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            panel/playwright-report
            panel/test-results
          retention-days: 14

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version used to live in six hand-synchronised files. This is the
      # gate that makes drift impossible rather than merely discouraged.
      - name: Check version consistency
        run: python scripts/release.py --check

      # Every command, alias and option the argparse tree exposed still exists.
      # They are in scripts and in muscle memory, so losing one is a breaking
      # change whether or not anyone meant it.
      - name: Check the command surface
        run: |
          pip install -e ".[all]"
          python scripts/cli_parity.py

      # There used to be two man pages, diverged, fifteen releases stale, and
      # the one shipped in the .deb declared the wrong licence.
      # panel/openapi.json is the one input of the console's generated
      # types; a schema the API no longer produces is a contract the panel
      # was built against that the server has since moved past.
      - name: Check the OpenAPI export is current
        run: python scripts/export_openapi.py --check

      - name: Check the man page is current
        run: python scripts/generate_man.py --check

      # Committed rather than generated at package build time, so a Click
      # upgrade that changes the shim has to be noticed here.
      - name: Check the completion scripts are current
        run: python scripts/generate_completions.py --check

      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
