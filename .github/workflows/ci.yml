name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:
    branches: [main]

# A new push supersedes the previous run for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keeping the linter and type checker pinned means CI does not turn red
  # because a tool released a new rule overnight.
  RUFF_VERSION: "0.14.4"
  MYPY_VERSION: "1.19.0"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff==${RUFF_VERSION}"

      - name: Check lint rules
        run: ruff check src/wasm tests scripts

      - name: Check formatting
        run: ruff format --check src/wasm tests scripts

  types:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # Type checking is the guard that matters most in this codebase: every
      # one of the calls to methods that did not exist, and which shipped for
      # entire releases because a blind except swallowed the AttributeError,
      # is caught here.
      - name: Install project and type checker
        run: |
          pip install -e ".[all,dev]"
          pip install "mypy==${MYPY_VERSION}"

      # Blocks against a committed baseline that can only shrink. Errors that
      # mean "this name does not exist" fail at zero regardless, because they
      # are the reason the gate exists.
      - name: Run mypy
        run: python scripts/typecheck.py

  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is what Ubuntu 26.04 LTS ships, and it is where tarfile
        # tightened addfile(); testing it here is how that surfaced.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: pip install -e ".[all,dev]"

      - name: Run tests
        run: pytest --cov=wasm --cov-report=xml --cov-report=term-missing

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  smoke:
    name: Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: pip install -e ".[all]"

      # Importing every module catches syntax errors, circular imports and
      # missing dependencies in code paths no test happens to reach.
      - name: Import every module
        run: |
          python - <<'PY'
          import importlib, pkgutil, sys
          import wasm

          failed = []
          for mod in pkgutil.walk_packages(wasm.__path__, "wasm."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {exc.__class__.__name__}: {exc}")
          if failed:
              print("Modules that failed to import:")
              for line in failed:
                  print(f"  {line}")
              sys.exit(1)
          print("All modules import cleanly")
          PY

      - name: Run the CLI
        run: |
          wasm --version
          wasm --help

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The version used to live in six hand-synchronised files. This is the
      # gate that makes drift impossible rather than merely discouraged.
      - name: Check version consistency
        run: python scripts/release.py --check

      # The panel serves no third-party asset it does not carry, so an
      # air-gapped server still gets a working page.
      - name: Check vendored assets
        run: python scripts/vendor_assets.py --check

      # Every command, alias and option the argparse tree exposed still exists.
      # They are in scripts and in muscle memory, so losing one is a breaking
      # change whether or not anyone meant it.
      - name: Check the command surface
        run: |
          pip install -e ".[all]"
          python scripts/cli_parity.py

      # There used to be two man pages, diverged, fifteen releases stale, and
      # the one shipped in the .deb declared the wrong licence.
      - name: Check the man page is current
        run: python scripts/generate_man.py --check

      # Committed rather than generated at package build time, so a Click
      # upgrade that changes the shim has to be noticed here.
      - name: Check the completion scripts are current
        run: python scripts/generate_completions.py --check

      - name: Build distributions
        run: |
          pip install build twine
          python -m build
          twine check dist/*
