[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wasm-cli"
version = "0.15.8"
description = "Web App System Management - Deploy and manage web applications on Linux servers"
readme = "README.md"
license = { text = "WASM-NCSAL" }
requires-python = ">=3.10"
authors = [
    { name = "Yago López Prado", email = "yago.lopez.adeje@gmail.com" }
]
keywords = [
    "cli",
    "deployment",
    "nginx",
    "apache",
    "systemd",
    "web-apps",
    "server-management",
    "certbot",
    "ssl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: Other/Proprietary License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "Jinja2>=3.1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
interactive = [
    "inquirer>=3.1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "syrupy>=4.6",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
]
rich = [
    "rich>=13.0",
]
monitor = [
    "psutil>=5.9.0",
    "httpx>=0.25.0",
]
web = [
    "fastapi>=0.109.0",
    # Imported directly for HTTPConnection, which covers both HTTP requests and
    # WebSocket handshakes in the security middleware. FastAPI happens to pull
    # it in, but relying on a transitive dependency is how a working install
    # breaks on an unrelated upgrade.
    "starlette>=0.36.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "psutil>=5.9.0",
]
all = [
    "inquirer>=3.1.0",
    "rich>=13.0",
    "psutil>=5.9.0",
    "httpx>=0.25.0",
    "fastapi>=0.109.0",
    "starlette>=0.36.0",
    "pydantic>=2.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.scripts]
wasm = "wasm.main:cli"

[project.urls]
Homepage = "https://github.com/Perkybeet/wasm"
Documentation = "https://github.com/Perkybeet/wasm#readme"
Repository = "https://github.com/Perkybeet/wasm.git"
"Bug Tracker" = "https://github.com/Perkybeet/wasm/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["wasm*"]

[tool.setuptools.package-data]
wasm = [
    "templates/**/*.j2",
    "completions/*",
    "web/static/**/*",
    "py.typed",
]

[tool.mypy]
python_version = "3.10"
files = ["src/wasm"]
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
exclude = [
    "build",
    "dist",
    ".venv",
]

# Third-party packages without type information. Listed one by one rather than
# with a blanket ignore_missing_imports, so a new untyped dependency is a
# deliberate decision instead of a silent one.
[[tool.mypy.overrides]]
module = [
    "jose.*",
    "inquirer.*",
    "questionary.*",
    "psutil.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
addopts = "--strict-markers --strict-config"
filterwarnings = [
    "error::DeprecationWarning:wasm.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit: this project runs as root
    "BLE",  # flake8-blind-except: the defect class that hid five broken methods
    "T20",  # flake8-print: output goes through the presenter, not print()
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line length is handled by the formatter
    "S603",  # subprocess call: the runner is the audited seam for this
    "S607",  # partial executable path: PATH lookup is intended for system tools
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on things bandit dislikes and print freely.
"tests/**" = ["S101", "S105", "S106", "S108", "T20", "BLE"]
# The release script is a developer tool, not shipped code.
"scripts/**" = ["T20"]
